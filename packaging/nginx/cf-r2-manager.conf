# Replace the hostname and certificate paths before enabling this file.
# Preserve the public Host header because S3 SigV4 signs it.

server {
    listen 443 ssl http2;
    server_name manager.example.com;
    ssl_certificate /etc/letsencrypt/live/manager.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manager.example.com/privkey.pem;

    client_max_body_size 0;
    location / {
        proxy_pass http://127.0.0.1:14325;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
