data_dir: /var/lib/cf-r2-manager
database_path: /var/lib/cf-r2-manager/manager.db
master_key_file: /var/lib/cf-r2-manager/master.key
log_level: info
trusted_proxies:
  - 127.0.0.1/32
  - ::1/128
listeners:
  admin: 127.0.0.1:8080
  s3: 127.0.0.1:9000
  webdav: 127.0.0.1:9001
  ai: 127.0.0.1:9002
  metrics: 127.0.0.1:9090
r2:
  logical_bucket: storage
  temp_dir: /var/lib/cf-r2-manager/tmp
  storage_soft_limit_bytes: 9000000000
  class_a_soft_limit: 900000
  class_b_soft_limit: 9000000
ai:
  neuron_soft_limit: 9000
  max_retry_accounts: 2
