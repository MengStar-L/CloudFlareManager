data_dir: /opt/CloudFlareManager/data
database_path: /opt/CloudFlareManager/data/manager.db
master_key_file: /opt/CloudFlareManager/data/master.key
log_level: info
trusted_proxies:
  - 127.0.0.1/32
  - ::1/128
listeners:
  # 管理控制台（Web 界面）
  admin: 0.0.0.0:14325
  # 协议前端默认仅监听本机，经反向代理暴露；直连请改为 0.0.0.0
  s3: 127.0.0.1:14326
  webdav: 127.0.0.1:14327
  ai: 127.0.0.1:14328
  metrics: 127.0.0.1:14329
r2:
  logical_bucket: storage
  temp_dir: /opt/CloudFlareManager/data/tmp
  # 服务端强制分片块大小（字节，最小 5MiB）：大 PUT 切块转发，磁盘峰值仅一块；小磁盘可调小
  upload_chunk_bytes: 67108864
  storage_soft_limit_bytes: 9000000000
  class_a_soft_limit: 900000
  class_b_soft_limit: 9000000
ai:
  neuron_soft_limit: 9000
  max_retry_accounts: 2
