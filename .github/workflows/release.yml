name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build embedded web console
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Test release source
        run: go test -count=1 ./...
      - name: Build Linux archives
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -eu
          mkdir -p dist
          build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ldflags="-s -w -X github.com/cf-r2-manager/cf-r2-manager/internal/version.Version=${VERSION} -X github.com/cf-r2-manager/cf-r2-manager/internal/version.Commit=${COMMIT} -X github.com/cf-r2-manager/cf-r2-manager/internal/version.Date=${build_date}"
          for target in amd64 arm64 arm-v7; do
            case "$target" in
              amd64) goarch=amd64; goarm= ;;
              arm64) goarch=arm64; goarm= ;;
              arm-v7) goarch=arm; goarm=7 ;;
            esac
            name="cf-r2-manager_${VERSION#v}_linux_${target}"
            stage="dist/${name}"
            mkdir -p "$stage"
            GOOS=linux GOARCH="$goarch" GOARM="$goarm" CGO_ENABLED=0 \
              go build -trimpath -ldflags "$ldflags" -o "$stage/cf-r2-manager" ./cmd/cf-r2-manager
            # 裸二进制产物供软件内自升级下载（命名与 internal/platform/update 的约定一致）
            cp "$stage/cf-r2-manager" "dist/cf-r2-manager-linux-${goarch}"
            cp LICENSE NOTICE README.md "$stage/"
            cp -R third_party "$stage/"
            cp -R docs packaging "$stage/"
            tar -C dist -czf "dist/${name}.tar.gz" "$name"
            rm -rf "$stage"
          done
          # 稳定命名的安装脚本，供 README 一键安装命令引用
          cp packaging/scripts/install.sh dist/install-linux.sh
          cd dist
          sha256sum -- *.tar.gz cf-r2-manager-linux-* > checksums.txt
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/cf-r2-manager_${{ github.ref_name }}.spdx.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes --verify-tag
